name: CI — Security & Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ========================================
  # JOB 1: Lint, Type-check & Security Audit
  # ========================================
  quality-and-security:
    runs-on: ubuntu-latest
    concurrency: { group: ci-quality-${{ github.ref }}, cancel-in-progress: true }

    steps:
      - uses: actions/checkout@v4
        with:
          cache: npm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Run security audit (audit-ci)
        # audit-ci exits non-zero on high+ vulnerabilities, blocking the pipeline.
        # Unlike `npm audit`, it provides a structured JSON report and supports
        # allowlisting of known transitive vulnerabilities.
        # The audit-ci report is uploaded as an artifact for traceability.
        run: |
          npx audit-ci --high --config .audit-ci.json --report-full --output json --output-file audit-ci-report.json
          echo "::notice::npm audit completed — see audit-ci-report.json artifact for details"

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-ci-report.json
          retention-days: 7

  # ========================================
  # JOB 2: Unit & Integration Tests
  # ========================================
  test:
    needs: quality-and-security
    runs-on: ubuntu-latest
    concurrency: { group: ci-test-${{ github.ref }}, cancel-in-progress: true }

    steps:
      - uses: actions/checkout@v4
        with:
          cache: npm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run security tests (secret scan)
        run: npm run test:security

      - name: Run all tests
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  # ========================================
  # JOB 3: Build (Expo Application Services)
  # ========================================
  build-android:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: EAS Build (Android)
        run: eas build --platform android --profile preview --non-interactive

  build-ios:
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: EAS Build (iOS)
        run: eas build --platform ios --profile preview --non-interactive
